name: CI

# Every pull request and every push to main.
#   website: types, lint, tests and a production build on Ubuntu.
#   desktop: types, tests, a real Arduino CLI compile and an unsigned
#            installer on Windows, Ubuntu and macOS (issue #54).
#   mcp:     the MCP server's typecheck and self-test.
# A red check means the change isn't ready to merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # The website never starts Electron, so it never needs the binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  website:
    name: Website · typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  desktop:
    name: Desktop · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            builder: --win
          - os: ubuntu-latest
            label: Ubuntu
            builder: --linux
          - os: macos-latest
            label: macOS
            builder: --mac
    env:
      # The desktop jobs do need Electron: electron-builder packs it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
      # Unsigned builds everywhere until signing lands (sprint 6).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      KIUNGO_ARDUINO_CONFIG: ${{ github.workspace }}/.ci/arduino-cli.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packaging tools (rpm target)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - run: npm ci

      - name: Typecheck the desktop app
        run: npm run typecheck -w @kiungo/desktop

      - name: Fetch the pinned Arduino CLI for this system
        run: npm run fetch:arduino-cli -w @kiungo/desktop

      - name: Resolve the Arduino CLI path
        id: cli
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) key=win32-x64; exe=arduino-cli.exe ;;
            Linux)   key=linux-x64; exe=arduino-cli ;;
            macOS)   key=darwin-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64); exe=arduino-cli ;;
          esac
          echo "path=$GITHUB_WORKSPACE/apps/desktop/resources/bin/$key/$exe" >> "$GITHUB_OUTPUT"

      - name: Cache the Arduino AVR core
        uses: actions/cache@v4
        with:
          path: .ci/arduino
          key: arduino-avr-1.8.6-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Uno core (arduino:avr@1.8.6)
        shell: bash
        env:
          CLI: ${{ steps.cli.outputs.path }}
        run: |
          mkdir -p .ci/arduino/data .ci/arduino/downloads .ci/arduino/sketchbook
          cat > .ci/arduino-cli.yaml <<CFG
          directories:
            data: $GITHUB_WORKSPACE/.ci/arduino/data
            downloads: $GITHUB_WORKSPACE/.ci/arduino/downloads
            user: $GITHUB_WORKSPACE/.ci/arduino/sketchbook
          CFG
          "$CLI" --config-file .ci/arduino-cli.yaml core update-index
          "$CLI" --config-file .ci/arduino-cli.yaml core install arduino:avr@1.8.6
          "$CLI" --config-file .ci/arduino-cli.yaml lib install NewPing
          "$CLI" --config-file .ci/arduino-cli.yaml version

      - name: Test the core, api, ui and desktop packages (with the real compile and the Hybrid shim)
        env:
          KIUNGO_ARDUINO_CLI: ${{ steps.cli.outputs.path }}
          # The shim tests compile with avr-gcc directly from the installed core (apps/desktop/test/hybrid-shim.test.ts).
          KIUNGO_ARDUINO_DATA: ${{ github.workspace }}/.ci/arduino/data
          KIUNGO_AVR_LIBRARIES: ${{ github.workspace }}/.ci/arduino/sketchbook/libraries
        shell: bash
        run: npx vitest run packages apps 2>&1 | tee vitest.log; exit ${PIPESTATUS[0]}

      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        # The failure text as check annotations, readable from the API without downloading the log.
        run: |
          grep -nE "^ (FAIL|×)|AssertionError|Error:|expected" vitest.log | head -40 | while IFS= read -r line; do
            printf '::error title=vitest (%s)::%s\n' "${{ matrix.label }}" "${line//$'\r'/}"
          done

      - name: Build the renderer, preload and main bundles
        run: npm run build -w @kiungo/desktop

      - name: Package an unsigned installer
        run: npx electron-builder ${{ matrix.builder }} --publish never
        working-directory: apps/desktop

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: kiungo-desktop-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip

  mcp:
    name: MCP server · typecheck and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mcp
      - run: npm run typecheck
        working-directory: mcp
      - run: npm test
        working-directory: mcp
